# Default configuration for the personal agent runtime.
# Copied to ~/.config/agent/config.toml by `agent init`.
# Every value can be overridden by an AGENT_<SECTION>__<KEY> environment variable.

[db]
dsn = "postgresql://agent:agent@127.0.0.1:55432/agent"
min_size = 1
max_size = 8

[llm]
# The SIR router, which schedules GPU residency and queues across models. Talking to vLLM
# directly on :8001 bypasses that, so the backend can vanish mid-request when SIR swaps models.
base_url = "http://127.0.0.1:8000/v1"
api_key = "not-needed"
model = "Qwen/Qwen3.8-27B-FP8"
timeout_s = 300.0
max_context_tokens = 262144

[llm.roles.main]
temperature = 0.7
top_p = 0.8
thinking = false
max_tokens = 4096

[llm.roles.subagent]
temperature = 0.7
top_p = 0.8
thinking = false
max_tokens = 4096

# Rewriting a question into search variants sits on the critical path of a deep retrieval,
# so it is deliberately a small, fast, non-thinking call.
[llm.roles.rewrite]
temperature = 0.3
top_p = 0.8
thinking = false
max_tokens = 256

# Compressing a conversation into a handoff object. Low temperature and no thinking: this
# call is an extraction from a transcript, and the one thing it must not do is invent a
# detail the successor will then act on.
[llm.roles.handoff]
temperature = 0.2
top_p = 0.8
thinking = false
max_tokens = 2048

[llm.roles.judge]
temperature = 0.6
top_p = 0.95
thinking = true
max_tokens = 2048

[llm.roles.consolidate]
temperature = 0.6
top_p = 0.95
thinking = true
max_tokens = 8192

[embed]
model = "BAAI/bge-small-en-v1.5"
dim = 384
rerank_model = "Xenova/ms-marco-MiniLM-L-6-v2"
enabled = true

[agent]
max_steps = 12
history_tokens = 24000
context_budget_tokens = 2000
tool_result_max_chars = 8000
autonomy = "assist"
# Session 9c. One extra step for a turn that has spent `max_steps`, offering `delegate` and
# nothing else, before the tool-free summary step. It costs at most one model call per
# exhausted turn and nothing at all on a turn that ends early.
escape_step = true

# Pass 6. Off is the shipped mode: a worker's transcript is archived and stays in the
# runtime. Turning this on puts it in the delegating model's context along with the result,
# which is a debugging tool and not a way to run.
[delegation]
debug_transcripts = false

[retrieval]
fast_budget_tokens = 2000
deep_budget_tokens = 4000
channel_limit = 30
rerank_top_k = 30
ef_search = 80

# The review gate has exactly one consumer, the daemon's consolidation loop, so a stopped
# daemon looks identical to an empty queue. These thresholds are what `agent doctor` and the
# heartbeat use to tell those apart; `agent memory queue --process` drains it by hand.
[review]
pending_warn_after_s = 7200
user_pending_warn_after_s = 300

[paths]
# ~ is expanded at load time
data_dir = "~/.local/share/agent"
allowed_roots = [
    "~/Projects",
    "~/Documents",
    "~/.local/share/agent/workspace",
    "~/.local/share/agent/memory",
]
# The project a delegated worker works on, and the directory `shell_exec` mounts rw at
# /workspace. Stated here on purpose: nothing infers it from cwd or git, so a worker that
# is not told this path has no way to find the repo. Must be inside allowed_roots. Unset
# means there is no project and the sandbox mounts the (empty) workspace instead.
# project = "~/Projects/agent"

[sandbox]
image = "agent-sandbox:local"
memory = "2g"
cpus = "2"
default_timeout_s = 120
max_timeout_s = 600

[daemon]
heartbeat_interval_s = 1800
quiet_hours = [23, 8]
idle_consolidate_after_s = 900
nightly_at = "03:30"
scheduler_poll_s = 10

[obs]
otlp_endpoint = "localhost:4317"
enabled = true
capture_content = false
jaeger_ui = "http://127.0.0.1:16686"

# Pass 1 baseline measurement: one JSON line per turn, counting tool calls, unused visible
# tools, selection failures, context tokens and latency. Separate from [obs] because tracing
# is for inspecting one turn that went wrong and this is for counting every turn so two
# builds can be compared. Pass 2 replaces it with the run journal.
[telemetry]
enabled = true
# path = "~/.local/share/agent/logs/telemetry.jsonl"   # unset means exactly this

# The run journal: one append-only event log per run, and the durability substrate the
# checkpoint, resume and effect machinery in Passes 3-5 fold over. Unlike [telemetry] there
# is no way to switch it off - it is the source of truth, not a measurement of one.
[journal]
# path = "~/.local/share/agent/journal.db"   # unset means exactly this
synchronous = "FULL"       # fsync every commit; NORMAL survives a kill but not a power cut
buffering = true           # effect_* and checkpoint_written ignore this and always go now
buffer_max = 32
buffer_max_age_s = 1.0
retention = "keep_everything"    # the other mode is "max_age_days"; pruning drops whole runs
# retention_max_age_days = 90

# Checkpoints: a snapshot of where a run had got to, written at five boundaries
# (turn_end, worker_finished, pre_effect, handoff, manual) so a killed process can be
# resumed. Unlike [journal] this one has a switch, because a checkpoint is an acceleration
# structure over the journal rather than a second source of truth: with it off, resume is
# slower and no answer changes. Still off now that session 4b has landed resume, because
# resume folds the journal and needs no snapshot - it reads one when there is one. Turn it
# on to make a resume cheap; it costs a flush and two commits per boundary (~1.3 ms).
[checkpoints]
enabled = false

# Context handoff (Pass 5). The runtime watches how much room the orchestrator has left and
# says when that is not enough; the orchestrator is never asked to monitor its own context.
#
# Remaining room is measured against agent.history_tokens (24000) - the only budget this
# runtime enforces on what carries forward, since context.history_messages silently drops
# the oldest turns once it is spent. It is NOT llm.max_context_tokens (262144): the largest
# prompt this system can assemble is about 56k tokens and the largest ever observed was
# 6,251, so a threshold measured against the model window could never fire.
#
# Every number in this reading is an estimate (len/3.2), never a provider token count - the
# router in front of this model drops the usage chunk, so no real count exists to use.
[handoff]
threshold_tokens = 8000      # fires with a third of the ceiling still free
# ceiling_tokens = 24000     # unset means agent.history_tokens; the model window still
                             # wins when it is the smaller of the two

# What a handoff is generated from and what the successor keeps (session 5b). The reading
# that decides is of what *carries forward* - history plus this turn - not of the whole
# assembled prompt: a turn with twelve full-size tool results fills the prompt and leaves
# nothing behind, so compressing the conversation for it would lose something to save
# nothing.
generator_role = "handoff"   # [llm.roles.handoff]; falls back to main if unset
carry_messages = 4           # messages after the watermark the successor still sees verbatim
carry_tokens = 2000          # ...and the budget that binds first, so the successor starts roomy
excerpt_chars = 1500         # per source message shown to the generator
source_chars = 48000         # total shown to the generator, newest first

# The manifest and the lookup (session 5c/5d). A handoff drops material; the manifest is
# the list of what it dropped - one line per item, with a ref - and the lookup is a
# read-class tool that fetches exactly one of those refs. Together they are what lets a
# successor say "I do not have that" and then go and get it, instead of answering from a
# summary as though it were the thing.
manifest_excerpt_chars = 160   # how an item is described: its first characters, not a summary
manifest_items = 40            # how many are listed, newest first; the rest are counted
lookup_max_chars = 4000        # the bound on one lookup, deliberately below tool_result_max_chars

# Cold resume (session 5c). A run picked up after its process died is replayed verbatim
# when it is recent and still fits, and compressed into a handoff when it is not. Lossless
# where the lossless path fits; the pass file's third Must not is the other direction.
warm_window_s = 14400          # four hours, untuned - there are no traces yet and it says so
# resume_budget_tokens = 24000 # unset means agent.history_tokens

[mcp]
http_port = 8770

# External MCP servers whose tools this agent imports. They are foreign code, so imported
# tools arrive as source="mcp:<name>", which the shipped policy sends to approval, and their
# output is wrapped as untrusted unless you say otherwise. Add one per server, e.g.:
#
# [mcp.servers.notes]
# command = "uvx"
# args = ["mcp-server-notes"]
# risk_default = "external"   # what the policy sees when the server has no usable hints
# trust_output = false        # true only for a server you wrote and fully control
# trust_annotations = false   # true to believe the server's own readOnly/destructive hints
# allow_tools = ["search"]    # omit to import everything the server offers
# timeout_s = 30.0

# Push, so a notification reaches you when no terminal is open. Self-host ntfy on this box and
# reach it over Tailscale; nothing then leaves hardware you control. Disabled until you set up
# the server, because a notifier pointed at nothing just accumulates failed attempts.
[ntfy]
enabled = false
base_url = "http://127.0.0.1:8088"
topic = "agent"
min_level = "info"
# When push may not wake you. Unset inherits [daemon] quiet_hours; [0, 0] is an empty
# window, so push never waits. These are deliberately two settings: "may this wake me"
# and "should the agent spend an LLM turn now" are different questions, and one window
# cannot answer both. Wake me whenever but do not think overnight:
#   [ntfy]   quiet_hours = [0, 0]
#   [daemon] quiet_hours = [23, 8]
# quiet_hours = [0, 0]

# Connectors are daemon-side code, not tools. They hold the credential, the agent never sees it,
# and nothing the agent can call reaches them — that is the whole reason this is a connector and
# not a `github_search` tool. Everything a connector ingests is archived as an untrusted raw
# event; there is no trusted-sender list, because a sender is a claim and not a credential. Any
# open loop one opens has a title this code composed, and the remote system's own words land only
# in `detail`, which is where they stay.
#
# Ships disabled. To turn GitHub on:
#   agent secrets set github/<your-login> token   # a PAT; stdin keeps it out of your history
#   agent connectors poll github                  # one poll, in the foreground, with output
[connectors]
enabled = false
notify_after_failures = 5

[connectors.github]
enabled = false
user = ""                 # your GitHub login; the token lives in the vault at github/<user>
poll_interval_s = 60      # a floor: GitHub's X-Poll-Interval can raise it, never lower it
review_due_in_h = 0       # 0 invents no deadlines — and so the heartbeat stays quiet about
                          # GitHub, since overdue_loops() only sees loops that have a due_at.
                          # Set 24 if you would rather it spoke up.
# Which notification reasons become an open loop, and which of those also reach your phone.
include_reasons = ["review_requested", "assign", "mention"]
notify_reasons = ["review_requested", "mention"]

# --- Google: Gmail and Calendar, one OAuth client, one account entry each -----
#
# The credential is a refresh token obtained once in a browser, and the scopes are
# read-only: gmail.readonly cannot mark a message read or send one, calendar.readonly
# cannot write an event. That is enforced by Google rather than by this code's restraint.
#
#   1. In a Google Cloud project, enable the Gmail API and the Calendar API, and create an
#      OAuth client of type "Desktop app".
#   2. agent secrets set google/client client_id
#      agent secrets set google/client client_secret
#   3. agent connectors auth <label>        # opens a consent page, stores a refresh token
#      #  on a headless box: agent connectors auth <label> --port 8771
#      #  with `ssh -L 8771:127.0.0.1:8771 thisbox` from wherever the browser is
#      #  (any free port: Google exempts loopback redirects from exact URI matching)
#   4. agent connectors poll gmail-<label>
#
# Each account under [connectors.google.accounts] becomes up to two connectors, gmail-<label>
# and gcal-<label>, because one being rate-limited should not stall the other. The label is
# the connector name, so it is lowercase letters, digits, - and _ only.
[connectors.google]
enabled = false

# [connectors.google.accounts.nyu]
# address = "you@nyu.edu"       # the refresh token lives at google/<address>
# mail = true
# calendar = true
# calendar_id = "primary"
# query = "is:unread in:inbox"  # server-side narrowing, before the rules below
# horizon_days = 14             # calendar: how far ahead one poll looks
# poll_interval_s = 120
#
# [connectors.google.accounts.nyu.rules]
# direct_only = true            # you in To or Cc
# skip_bulk = true              # List-Unsubscribe, List-Id, Precedence, Auto-Submitted
# aliases = ["first.last@nyu.edu"]   # other addresses that are also you
# skip_senders = ["@noreply.example.edu", "notifications@github.com"]
# due_in_h = 0                  # 0 invents no deadlines; delivery is then via push only
# notify = true

# --- IMAP: a mailbox with no API ---------------------------------------------
#
# A mail password is the whole mailbox - there is no read-only scope to hide behind - so
# the read-only guarantee is structural: the mailbox is opened with EXAMINE and headers are
# fetched with BODY.PEEK, neither of which can set \Seen.
#
#   agent secrets set imap/<label> password
#   agent connectors poll imap-<label>
[connectors.imap]
enabled = false

# [connectors.imap.accounts.dodds]
# host = "mail.hostedemail.com"
# port = 993
# username = "you@example.org"
# address = "you@example.org"   # what "addressed to you" means here; defaults to username
# mailbox = "INBOX"
# poll_interval_s = 300
#
# [connectors.imap.accounts.dodds.rules]
# direct_only = true
# skip_bulk = true

# --- Brightspace: the per-user calendar feed ----------------------------------
#
# Not the Valence API, which needs an application key a D2L administrator registers. In
# Brightspace: Calendar -> Subscribe, copy the link, then
#
#   agent secrets set brightspace/nyu ics_url
#
# The link contains a token, so it is a credential and lives in the vault. Unlike mail and
# GitHub this connector does set a real due_at, because somebody else set that deadline -
# which means the heartbeat will speak up once one passes.
[connectors.brightspace]
enabled = false
label = "nyu"
horizon_days = 21
poll_interval_s = 1800
all_day_loops = false   # reading week is not a deadline
require = []            # e.g. ["due"] once you have seen what your own feed contains
notify = true

# --- Telegram: a chat front end, not a connector and not a tool ---------------
#
# A connector is inbound-only and holds a credential the agent cannot reach. A tool is
# something the model calls. This is neither: it is a way for *you* to reach the loop from
# a phone, in the same category as `agent chat`. The model cannot send a message of its own
# choosing to anyone of its choosing — it answers you, on the thread you started.
#
#   1. Talk to @BotFather on Telegram, /newbot, copy the token
#   2. agent secrets set telegram/bot token
#   3. agent telegram check                 # is the token good, and who is the bot
#   4. message the bot anything, then: agent telegram whoami
#   5. put that id in allowed_chat_ids below, enable, restart the daemon
#
# allowed_chat_ids is the entire security boundary: anyone who learns the bot's username
# can message it. An empty list means nobody, not everybody.
#
# Worth knowing before switching this on: Telegram bot messages are NOT end-to-end
# encrypted. They cross Telegram's servers in a form Telegram can read. Everything else in
# this system was built so nothing leaves hardware you control — ntfy is self-hosted on the
# tailnet for exactly that reason — and this is the one place that stops being true. An
# answer about your mail is an answer that reached Telegram.
[telegram]
enabled = false
allowed_chat_ids = []
autonomy = "assist"      # same as the CLI; external work still queues for /approve
poll_timeout_s = 50      # long polling, so this box needs no inbound port
max_message_chars = 4000
# Show which tools each answer used, as they run, in a single message that fills in. In a
# terminal you watch the tool lines scroll past; without this a phone answer arrives with
# no account of where it came from. `/tools off` turns it off for one chat.
show_tools = true
