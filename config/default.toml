# Default configuration for the personal agent runtime.
# Copied to ~/.config/agent/config.toml by `agent init`.
# Every value can be overridden by an AGENT_<SECTION>__<KEY> environment variable.

[db]
dsn = "postgresql://agent:agent@127.0.0.1:55432/agent"
min_size = 1
max_size = 8

[llm]
# The SIR router, which schedules GPU residency and queues across models. Talking to vLLM
# directly on :8001 bypasses that, so the backend can vanish mid-request when SIR swaps models.
base_url = "http://127.0.0.1:8000/v1"
api_key = "not-needed"
model = "Qwen/Qwen3.8-27B-FP8"
timeout_s = 300.0
max_context_tokens = 262144

[llm.roles.main]
temperature = 0.7
top_p = 0.8
thinking = false
max_tokens = 4096

[llm.roles.subagent]
temperature = 0.7
top_p = 0.8
thinking = false
max_tokens = 4096

# Rewriting a question into search variants sits on the critical path of a deep retrieval,
# so it is deliberately a small, fast, non-thinking call.
[llm.roles.rewrite]
temperature = 0.3
top_p = 0.8
thinking = false
max_tokens = 256

[llm.roles.judge]
temperature = 0.6
top_p = 0.95
thinking = true
max_tokens = 2048

[llm.roles.consolidate]
temperature = 0.6
top_p = 0.95
thinking = true
max_tokens = 8192

[embed]
model = "BAAI/bge-small-en-v1.5"
dim = 384
rerank_model = "Xenova/ms-marco-MiniLM-L-6-v2"
enabled = true

[agent]
max_steps = 12
history_tokens = 24000
context_budget_tokens = 2000
tool_result_max_chars = 8000
autonomy = "assist"

[retrieval]
fast_budget_tokens = 2000
deep_budget_tokens = 4000
channel_limit = 30
rerank_top_k = 30
ef_search = 80

[paths]
# ~ is expanded at load time
data_dir = "~/.local/share/agent"
allowed_roots = [
    "~/Projects",
    "~/Documents",
    "~/.local/share/agent/workspace",
    "~/.local/share/agent/memory",
]

[sandbox]
image = "agent-sandbox:local"
memory = "2g"
cpus = "2"
default_timeout_s = 120
max_timeout_s = 600

[daemon]
heartbeat_interval_s = 1800
quiet_hours = [23, 8]
idle_consolidate_after_s = 900
nightly_at = "03:30"
scheduler_poll_s = 10

[obs]
otlp_endpoint = "localhost:4317"
enabled = true
capture_content = false
jaeger_ui = "http://127.0.0.1:16686"

[mcp]
http_port = 8770

# External MCP servers whose tools this agent imports. They are foreign code, so imported
# tools arrive as source="mcp:<name>", which the shipped policy sends to approval, and their
# output is wrapped as untrusted unless you say otherwise. Add one per server, e.g.:
#
# [mcp.servers.notes]
# command = "uvx"
# args = ["mcp-server-notes"]
# risk_default = "external"   # what the policy sees when the server has no usable hints
# trust_output = false        # true only for a server you wrote and fully control
# trust_annotations = false   # true to believe the server's own readOnly/destructive hints
# allow_tools = ["search"]    # omit to import everything the server offers
# timeout_s = 30.0

# Push, so a notification reaches you when no terminal is open. Self-host ntfy on this box and
# reach it over Tailscale; nothing then leaves hardware you control. Disabled until you set up
# the server, because a notifier pointed at nothing just accumulates failed attempts.
[ntfy]
enabled = false
base_url = "http://127.0.0.1:8088"
topic = "agent"
min_level = "info"
