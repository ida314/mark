# Deterministic policy engine rules. The LLM proposes actions; this file decides.
# Evaluation order: hard_deny -> rules (first match wins) -> risk_matrix default,
# then post-rules that can only tighten the outcome (taint, origin, subagent caps).
version: 1

defaults:
  autonomy: assist
  unknown_risk: external

risk_matrix:
  read:        {observe: allow, assist: allow,            act: allow,            trusted: allow}
  draft:       {observe: deny,  assist: allow,            act: allow,            trusted: allow}
  write:       {observe: deny,  assist: require_approval, act: require_approval, trusted: allow}
  external:    {observe: deny,  assist: require_approval, act: require_approval, trusted: require_approval}
  destructive: {observe: deny,  assist: require_approval, act: require_approval, trusted: require_approval}

hard_deny:
  - id: secrets-paths
    reason: credential material is never readable or writable by the agent
    match:
      args:
        path:
          glob:
            - "~/.ssh/**"
            - "~/.aws/**"
            - "~/.gnupg/**"
            - "~/.config/agent/secrets.toml"
            - "**/.env"
            - "**/*_rsa"
            - "**/id_ed25519*"
  - id: fs-outside-roots
    reason: filesystem access is confined to the allowed roots
    match:
      tags: [fs]
      args:
        path:
          not_under: ["${allowed_roots}"]
  - id: shell-docker-socket
    reason: the docker socket is root on this host
    match:
      tool: shell_exec
      args:
        command:
          regex: "docker\\.sock|/var/run/docker"
  # Tripwires for tools that deliberately do not exist. A mail connector drafts; a human
  # presses send. An absent code path is a stronger guarantee than a policy line, so these
  # exist to make adding one fail loudly rather than quietly — if you are reading this because
  # a rule fired, the tool you just wrote was not designed here.
  - id: no-mail-send-tool
    reason: there is no send tool by design; drafts are for a human to send
    match:
      tool: mail_send
  - id: no-mail-forward-tool
    reason: forwarding is the cheapest way to exfiltrate a mailbox, so it has no tool at all
    match:
      tool: mail_forward
  # The same three tripwires under the names a Gmail-specific tool would plausibly take.
  # gmail_search and gmail_message exist and are read-only; anything that writes to the
  # mailbox does not, and adding one should fail here rather than ship quietly.
  - id: no-gmail-send-tool
    reason: there is no send tool by design; drafts are for a human to send
    match:
      tool: gmail_send
  - id: no-gmail-forward-tool
    reason: forwarding is the cheapest way to exfiltrate a mailbox, so it has no tool at all
    match:
      tool: gmail_forward
  - id: no-gmail-modify-tool
    reason: the agent reads mail; labelling, archiving and deleting are yours
    match:
      tool: gmail_modify

  # --- the private-data interlock ------------------------------------------------------
  # Once a tool marked private_output has run, the user's own data is in the context window
  # alongside whatever a stranger wrote in it. These deny rather than ask: an approval
  # prompt on every web call after reading mail is approval fatigue, and fatigue is how the
  # one that matters gets waved through. `private` is set by the agent loop and is sticky
  # for the session; start a new conversation to get these back.
  #
  # Deliberately NOT keyed on `tainted`, which any web page raises - hard-denying on that
  # would mean fetching page 1 of a search makes page 2 impossible.
  - id: private-data-no-egress
    reason: your mail is in context, so nothing that can carry it off this box runs now
    match:
      private: true
      tags: [egress]
  - id: private-data-no-writes
    reason: private data in context must not turn into a side effect that outlives the turn
    match:
      private: true
      risk: [write, external, destructive]
  - id: private-data-no-mcp
    reason: a foreign server does not get a turn with your mailbox in context
    match:
      private: true
      source: "mcp:*"
  # Named rather than tagged, so `delegate(memory)` keeps working: that branch never builds
  # a sub-agent, it calls memory.retrieval.pack in this process. The other two do, and a
  # sub-agent gets a *fresh* Session whose flags start at their defaults - so it would begin
  # life unaware this one had read the mailbox, holding web_search and web_fetch. That makes
  # delegation the way around every other rule here, not merely another one of them.
  - id: private-data-no-outward-delegation
    reason: a sub-agent starts with a clean context and its own web tools; start a new
      session if you need one
    match:
      private: true
      tool: delegate
      args:
        agent:
          in: [researcher, coder]

rules:
  - id: workspace-writes-auto-in-act
    match:
      tool: fs_write
      autonomy: [act]
      args:
        path:
          under: ["${workspace}"]
    outcome: allow
  - id: sandbox-shell-no-net-auto-in-act
    match:
      tool: shell_exec
      autonomy: [act]
      args:
        network: {equals: false}
    outcome: allow
  # Reading the mailbox is something you ask for, not something that happens while you are
  # asleep. The heartbeat and scheduled watchers run with nobody watching, and a denial there
  # is silent by design - which is right for this one, because there is no such thing as a
  # background question about your email that cannot wait.
  - id: mail-tools-never-unattended
    reason: the mailbox is not read on your behalf while nobody is watching
    match:
      tags: [mail]
      origin: [daemon]
    outcome: deny
  - id: watchers-need-approval
    reason: creates autonomous behaviour that outlives this turn
    match:
      tool: watcher_add
    outcome: require_approval
  # Connectors are daemon-side code and are not tools, so nothing that exists today matches
  # either of these. They are for the outbound half that comes later: the moment a tool tagged
  # `connector` can send something — a reply, a mail, an invite — it has to stop at an approval
  # rather than be refused outright by daemon-never-external below. A denial in a background
  # turn is silent, and silence is how a prepared draft gets lost. Written and tested now so
  # that adding one later is not an edit to a security file under delivery pressure.
  - id: connector-drafts-queue-in-background
    reason: a background turn may prepare something outbound, but you decide whether it leaves
    match:
      tags: [connector]
      origin: [daemon]
      risk: [external]
    outcome: require_approval
  # Unreachable for origin: daemon, since the rule above catches that first. It earns its place
  # at interactive and trusted, where the risk matrix happens to agree today — this states the
  # intent directly, so a future loosening of that matrix cannot quietly take it away.
  - id: outbound-connector-always-asks
    reason: anything leaving this machine on your behalf is confirmed first, at every autonomy
    match:
      tags: [connector]
      risk: [external]
    outcome: require_approval
  - id: daemon-never-external
    reason: background turns never reach the outside world unattended
    match:
      origin: [daemon]
      risk: [external, destructive]
    outcome: deny
  - id: mcp-imported-default
    reason: tools imported from external MCP servers are not trusted by default
    match:
      source: "mcp:*"
    outcome: require_approval
