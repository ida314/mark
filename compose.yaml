name: agentd

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Push delivery. Bound to the Tailscale address rather than published broadly: the phone
  # reaches it over the tailnet and nothing about a notification leaves hardware you own.
  # The agent itself cannot reach it — web_fetch's SSRF guard blocks 100.64/10 on purpose —
  # which is the right way round, since this is the daemon's channel, not a tool.
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: http://gx10.tail2e282c.ts.net:8088
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "false"
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      # deny-all is the default for every topic. The `agent` topic is opened to anonymous
      # read-write by a grant held in the ntfy volume, not here, so a stack recreated from
      # this file alone will 403 every push until you re-run:
      #
      #   docker exec agentd-ntfy-1 ntfy access everyone agent rw
      #   docker exec agentd-ntfy-1 ntfy access --reset everyone agent   # to undo
      #
      # "Anonymous" is bounded by the ports below: loopback and the tailnet address only,
      # so it means a device you own, and the topic name stays the secret. To tighten it
      # instead, add a user and put a token at `ntfy/default` in the vault — the notifier
      # already reads one from there (see notifier._headers).
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
    volumes:
      - ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:8088:80"
      - "100.91.112.107:8088:80"

volumes:
  pgdata:
    name: agent_pgdata
  ntfy:
    name: agent_ntfy
