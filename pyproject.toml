[project]
name = "agentd"
version = "0.1.0"
description = "Persistent personal agent runtime"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "prompt-toolkit>=3.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "openai>=1.60",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "watchfiles>=1.0",
    "croniter>=6.0",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "mcp>=1.2",
    "fastembed>=0.5",
    "trafilatura>=2.0",
    "ddgs>=9.0",
]

[project.scripts]
agent = "agentd.cli.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `tests/test_handoff_lookup.py` imports `tests.test_handoff_manifest`. That resolves under
# `python -m pytest` (which puts cwd on sys.path) and not under `uv run pytest`, the command
# CLAUDE.md documents as the gate. Pinning the path here makes the two agree.
pythonpath = ["."]
markers = [
    "docker: needs the docker sandbox image",
    "live: needs a reachable LLM endpoint",
    "slow: downloads or runs real embedding models",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
